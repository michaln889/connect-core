spring:
  datasource:
    url: jdbc:postgresql://db:5432/connectcore
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 20
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration