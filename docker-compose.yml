version: '3.8'

services:
  db:
    image: postgres:15
    container_name: connectcore-db
    environment:
      POSTGRES_DB: connectcore
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: connectcore-app
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: